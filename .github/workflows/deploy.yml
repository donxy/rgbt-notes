name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore assets not stored in this repo (binary / oversized, fetched from Quartz upstream)
        run: |
          curl -fsSL https://raw.githubusercontent.com/jackyzha0/quartz/v4/quartz/static/icon.png -o quartz/static/icon.png
          curl -fsSL https://raw.githubusercontent.com/jackyzha0/quartz/v4/quartz/static/og-image.png -o quartz/static/og-image.png
          curl -fsSL https://raw.githubusercontent.com/jackyzha0/quartz/v4/quartz/util/emojimap.json -o quartz/util/emojimap.json
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
